name: Pull request

on:
  pull_request:
    # "edited" re-runs the checks when the title changes.
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  conventions:
    # Server-side copy of the local hooks: hooks can be skipped with --no-verify, CI cannot.
    name: conventions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # Pull requests are squash-merged, so the title becomes the commit on main.
      # Event fields reach the shell through env, never through inline expressions.
      - name: Pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 scripts/commit_lint.py --message "$PR_TITLE"
      # Dependabot names its own branches and writes commit bodies with long URLs;
      # its pull request title is still checked above.
      - name: Branch name
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: sh scripts/check-branch-name.sh "$HEAD_REF"
      - name: Commit messages
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/commit_lint.py --range "$BASE_SHA" "$HEAD_SHA"

  dependencies:
    # Fails when the pull request adds a dependency with a known vulnerability.
    name: dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: moderate
