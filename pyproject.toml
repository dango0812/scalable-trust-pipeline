[project]
name = "scalable-trust-pipeline"
version = "0.1.0"
description = "Training-data pipeline that carries trust metadata from a single record up to trillions"
readme = "README.md"
authors = [{ name = "dango0812" }]
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.16.0",
    "numpy>=2.5.5",
    "pyarrow>=26.0.1",
    "tokenizers>=0.23.3",
    "trafilatura>=2.4.0",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
]

# Model training and neural embeddings need PyTorch. Pick exactly one build:
#   uv sync --extra cpu   laptops and CI (no CUDA)
#   uv sync --extra gpu   GPU servers (CUDA 13.2 wheels)
[project.optional-dependencies]
cpu = ["peft>=0.22.0", "torch>=2.15.0", "transformers>=5.24.0"]
gpu = ["peft>=0.22.0", "torch>=2.15.0", "transformers>=5.24.0"]

[project.scripts]
trustpipe = "trustpipe.cli:main"

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "gpu" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu132", extra = "gpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu132"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trustpipe"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E", "F", "W", # pycodestyle, pyflakes
    "I",           # import order
    "UP",          # modern syntax for the target version
    "B", "SIM", "C4", "PIE", "RET", "PERF", # likely bugs and needless complexity
    "N",           # naming
    "PT",          # pytest style
    "PTH",         # pathlib over os.path
    "DTZ",         # no naive datetimes: every timestamp in the lake is timezone-aware
    "S",           # security (bandit)
    "RUF",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"] # pytest asserts; tests run git and our own scripts
"scripts/**" = ["S603", "S607"] # developer scripts run git with fixed arguments

[tool.mypy]
strict = true
warn_unreachable = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
files = ["src", "tests", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q", "--strict-markers", "--strict-config"]
xfail_strict = true
filterwarnings = ["error"] # a warning is a failure: deprecations are fixed, not ignored

[tool.coverage.run]
source = ["trustpipe"]
branch = true

[tool.coverage.report]
# Every line and branch of the package is exercised by a test; CI fails below that.
fail_under = 100
show_missing = true
skip_covered = true

[dependency-groups]
dev = [
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]
