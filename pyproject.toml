[project]
name = "scalable-trust-pipeline"
version = "0.1.0"
description = "Training-data pipeline that carries trust metadata from a single record up to trillions"
readme = "README.md"
authors = [{ name = "dango0812" }]
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=26.0.1",
    "tzdata>=2026.6 ; sys_platform == 'win32'",
]

[project.scripts]
trustpipe = "trustpipe.cli:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trustpipe"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-q"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pyarrow-stubs>=20.0.0.20260819",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
